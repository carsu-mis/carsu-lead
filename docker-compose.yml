version: "3.8"

services:
  db:
    image: postgres:14-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carsu_lead}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-carsu_lead}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    shm_size: "2gb"

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001

      # PostgreSQL
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-carsu_lead}

      # Application
      JWT_SECRET: ${JWT_SECRET}

      # Frontend URL
      FRONTEND_URL: ${FRONTEND_URL:-/}

      # Email
      HR_EMAIL: ${HR_EMAIL}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM}

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000

    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata: